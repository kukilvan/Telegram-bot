<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="htmx-config" content='{"includeIndicatorStyles": false, "allowEval": false}'>
  <title>{% block title %}Трекер релизов{% endblock %}</title>
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/static/icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161615" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Трекер">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
  <header class="top">
    <span class="site-name">Трекер релизов</span>
    {% if signed_in %}
    <nav class="menu" aria-label="Разделы">
      {% for section in sections %}
      <a href="{{ section.address }}"{% if section.address == current %} aria-current="page"{% endif %}>{{ section.label }}</a>
      {% endfor %}
    </nav>
    <form method="post" action="/logout">
      <button type="submit" class="link-button">Выйти</button>
    </form>
    {% endif %}
  </header>
  {% if signed_in %}{% include "status_line.html" %}{% endif %}
  <main>
    {% if notice %}<p class="notice" role="status">{{ notice }}</p>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
