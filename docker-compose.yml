version: "3.8"

services:
  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/app/logs
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'python -m app.bot.main' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
