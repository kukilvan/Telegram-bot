[project]
name = "telegram-release-tracker"
version = "0.1.0"
description = "Personal Telegram bot for tracking movie/TV/anime/game releases"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.31.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "SQLAlchemy>=2.0.0",
    "alembic>=1.13.0",
    "APScheduler>=3.10.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
